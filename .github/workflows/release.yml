name: 🔖 Release

permissions:
  contents: write
  packages: write

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (e.g., v1.2.3)
        type: string
        required: true
  push:
    tags:
      - 'v*'

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch'
    name: 🛠️ Prepare release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Validate version
        id: version
        run: |
          VERSION='${{ inputs.version }}'
          if ! echo "$VERSION" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' >/dev/null; then
            echo "Invalid version: $VERSION"
            exit 1
          fi
          echo "release_tag=$VERSION" >> $GITHUB_OUTPUT

      - name: Update chart version
        run: |
          VERSION='${{ steps.version.outputs.release_tag }}'
          VERSION_NO_V=${VERSION#v}
          sed -E "s/^version:.+$/version: ${VERSION_NO_V}/" -i install/kubernetes/github-actions-cache-server/Chart.yaml
          sed -E "s/^appVersion:.+$/appVersion: '${VERSION_NO_V}'/" -i install/kubernetes/github-actions-cache-server/Chart.yaml

      - name: Commit and tag
        run: |
          VERSION='${{ steps.version.outputs.release_tag }}'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add install/kubernetes/github-actions-cache-server/Chart.yaml
          git commit -m "chore(release): ${VERSION}" || true
          git tag -f "${VERSION}"
          git push origin dev
          git push origin --tags

  deploy-docker:
    name: 🚀 Build and push Docker image
    permissions:
      packages: write
      contents: read
    needs: [prepare]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && needs.prepare.outputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'dev' || github.ref_name }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{major}},value=${{ env.RELEASE_TAG }}
            latest

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  deploy-chart:
    name: 🚀 Build and push Helm chart
    permissions:
      packages: write
      contents: read
    needs: [prepare]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    env:
      CHART_DIR: install/kubernetes/github-actions-cache-server
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && needs.prepare.outputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && 'dev' || github.ref_name }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Helm chart
        run: helm package . --destination packaged
        working-directory: ${{ env.CHART_DIR }}

      - name: Push Helm chart to GHCR
        run: |
          shopt -s nullglob
          for pkg in ${{ env.CHART_DIR }}/packaged/*.tgz; do
            echo "Pushing $pkg to ghcr.io/${{ github.repository_owner }}/charts"
            helm push "$pkg" "oci://ghcr.io/${{ github.repository_owner }}/charts"
          done
