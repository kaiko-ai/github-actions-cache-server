name: 🚥 CI/CD

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 🧹 Go Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Check formatting
        run: test -z "$(gofmt -l .)"

  test-unit:
    name: 🧪 Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - run: go test ./...

  benchmark:
    name: 📊 Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - name: Run benchmarks
        env:
          BENCH_FILE_SIZES_MB: '10,50'
          BENCH_BUFFER_SIZES_KB: '64,256'
        run: go test ./... -bench . -benchmem -run ^$ -benchtime=1x

  deploy:
    if: github.event_name == 'push'
    name: 🚀 Build and push
    permissions:
      packages: write
      contents: read
    needs: [lint, test-unit, benchmark]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute branch tag
        id: branch-tag
        shell: bash
        run: |
          branch_tag="${GITHUB_REF_NAME//\//_}"
          echo "tag=${branch_tag}" >> "$GITHUB_OUTPUT"

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.branch-tag.outputs.tag }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
